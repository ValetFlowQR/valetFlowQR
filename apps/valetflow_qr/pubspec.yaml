name: valetflow_qr
description: "App móvil para el personal de valet parking"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  shared:
    path: ../../shared
  flutter_secure_storage: ^9.0.0
  camera: ^0.11.0+2


  # Firebase
  firebase_core: ^3.14.0
  firebase_auth: ^5.2.0
  google_mlkit_text_recognition: ^0.15.0
  image: ^4.5.4
  http: ^1.6.0
  path_provider: ^2.1.5
  path: ^1.8.3
  tflite_flutter: ^0.12.1
 
  # Cupertino Icons
  cupertino_icons: ^1.0.8
  cloud_firestore: ^5.6.12
  qr_flutter: ^4.1.0
  firebase_storage: ^12.4.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/car_model_classifier.tflite
    - assets/models/labels.txt
